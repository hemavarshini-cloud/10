
apiVersion: apps/v1
kind: Deployment
metadata:
  name: disaster-response-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: disaster-response-portal
  template:
    metadata:
      labels:
        app: disaster-response-portal
    spec:
      containers:
        - name: disaster-response-portal
          image: DOCKERHUB_USERNAME/disaster-response-portal:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: disaster-response-service
spec:
  type: NodePort
  selector:
    app: disaster-response-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
